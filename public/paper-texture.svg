<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <filter id="softCrumplePaper" x="0%" y="0%" width="100%" height="100%">
    <!-- Subtle, gentle macro crumple folds & crinkles -->
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="4" seed="19" result="folds" />
    <feDiffuseLighting in="folds" lighting-color="#ffffff" surfaceScale="1.8" result="light">
      <feDistantLight azimuth="45" elevation="65" />
    </feDiffuseLighting>
    
    <!-- Gentle shadow & highlight crease mask (softened) -->
    <feColorMatrix in="light" type="matrix" values="
      0 0 0 0 0.12
      0 0 0 0 0.10
      0 0 0 0 0.07
      -0.35 -0.35 -0.35 1.05 0" result="creaseMask" />
      
    <!-- Gentle, fine tactile paper fiber grain -->
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="8" result="grain" />
    <feColorMatrix in="grain" type="matrix" values="
      0 0 0 0 0.15
      0 0 0 0 0.12
      0 0 0 0 0.08
      0 0 0 0 0.05 0" result="grainMask" />
      
    <feMerge>
      <feMergeNode in="creaseMask" />
      <feMergeNode in="grainMask" />
    </feMerge>
  </filter>
  
  <rect width="100%" height="100%" filter="url(#softCrumplePaper)" opacity="0.38" />
</svg>
