<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <filter id="transparentCrumple">
    <!-- Macro crumple folds -->
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.022" numOctaves="4" seed="17" result="folds" />
    <feDiffuseLighting in="folds" lighting-color="#ffffff" surfaceScale="4.0" result="light">
      <feDistantLight azimuth="45" elevation="55" />
    </feDiffuseLighting>
    <!-- Convert lighting into transparent shadow & highlight mask -->
    <feColorMatrix in="light" type="matrix" values="
      0 0 0 0 0.15
      0 0 0 0 0.12
      0 0 0 0 0.08
      -0.6 -0.6 -0.6 1.8 0" result="creaseMask" />
      
    <!-- Micro paper grain -->
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="5" result="grain" />
    <feColorMatrix in="grain" type="matrix" values="
      0 0 0 0 0.18
      0 0 0 0 0.14
      0 0 0 0 0.09
      0 0 0 0.10 0" result="grainMask" />
      
    <feMerge>
      <feMergeNode in="creaseMask" />
      <feMergeNode in="grainMask" />
    </feMerge>
  </filter>
  
  <rect width="100%" height="100%" filter="url(#transparentCrumple)" opacity="0.85" />
</svg>
