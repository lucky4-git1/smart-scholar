<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <filter id="crumpleWarm" x="0%" y="0%" width="100%" height="100%">
    <!-- Distinct paper folds & crumple creases -->
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="4" seed="17" result="folds" />
    <feDiffuseLighting in="folds" lighting-color="#FFFDF9" surfaceScale="3.5" result="light">
      <feDistantLight azimuth="50" elevation="50" />
    </feDiffuseLighting>
    <!-- Stress wrinkles -->
    <feTurbulence type="turbulence" baseFrequency="0.05 0.07" numOctaves="3" seed="29" result="crinkles" />
    <feColorMatrix in="crinkles" type="matrix" values="0 0 0 0 0.40  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.12 0" result="crinkleShadow" />
    <!-- Fine pulp fibers -->
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="4" result="pulp" />
    <feColorMatrix in="pulp" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0.08 0" result="pulpShadow" />
    <!-- Composite -->
    <feBlend in="light" in2="crinkleShadow" mode="multiply" result="crumpleSurface" />
    <feBlend in="crumpleSurface" in2="pulpShadow" mode="multiply" />
  </filter>
  <rect width="100%" height="100%" fill="#F5EBD7" />
  <rect width="100%" height="100%" filter="url(#crumpleWarm)" opacity="0.9" />
</svg>
